name: flutter_application_mobile
description: "School Violation Detector - Mobile Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^13.2.0
  http: ^1.2.0
  speech_to_text: ^7.0.0
  map_location_picker:
    path: ../packages/map_location_picker
  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  sensors_plus: ^7.1.1
  vibration: ^3.2.1
  permission_handler: 12.0.1
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.3
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/sos_alert.mp3
